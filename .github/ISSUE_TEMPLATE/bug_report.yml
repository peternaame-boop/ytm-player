name: Bug report
description: Report something that's broken or behaving unexpectedly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        On ytm-player 2.3.0 or newer, you can share the public report below.
        On older versions, leave diagnostics blank. Keep raw logs, crash files,
        and detailed local diagnostics private.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear, concise description of the bug.
      placeholder: When I do X, Y happens instead of Z.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimal steps to trigger the bug.
      placeholder: |
        1. Launch ytm
        2. Press 'g l' to go to library
        3. ...
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: ytm report output
      description: On 2.3.0 or newer, run `ytm report` and paste its output here. On older versions, leave this field blank.
      render: shell
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Related issues or other context. Remove private details from screenshots.
